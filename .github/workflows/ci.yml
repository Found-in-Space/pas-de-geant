name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct pinned development dependencies
        run: npm run prepare:development

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Check shared dependencies
        run: npm run check:spatial-package

      - name: Check optional sky isolation
        run: npm run check:sky-isolation

      - name: Check packed consumers
        run: npm run check:package

      - name: Build static embed and examples
        run: npm run build:embed && npm run build:examples

      - name: Build integration cases
        run: npm run build:integration
